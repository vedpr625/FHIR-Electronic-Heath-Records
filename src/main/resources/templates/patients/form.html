<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Patient Registration - MediCare ERP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<div th:replace="~{fragments/nav :: topnav('patients')}"></div>
<nav class="sub-nav">
    <div class="sub-nav-container">
        <ul class="sub-nav-tabs">
            <li class="sub-nav-item"><a th:href="@{/patients}" class="sub-nav-link">Overview</a></li>
            <li class="sub-nav-item active"><a th:href="@{/patients/new}" class="sub-nav-link">Registration</a></li>
        </ul>
    </div>
</nav>
<div class="main-container">
    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="section-title">PATIENT MANAGEMENT</div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a th:href="@{/patients}" class="menu-link"><i class="fas fa-users" style="color:#43a047"></i><span>Patient Overview</span></a></li>
                <li class="menu-item"><a th:href="@{/patients/new}" class="menu-link active"><i class="fas fa-user-plus" style="color:#43a047"></i><span>New Patient</span></a></li>
            </ul>
        </div>
        <div class="sidebar-section">
            <div class="section-title">APPOINTMENTS</div>
            <ul class="sidebar-menu">
                <li class="menu-item"><a th:href="@{/appointments/new}" class="menu-link"><i class="fas fa-calendar-plus" style="color:#1e88e5"></i><span>Schedule</span></a></li>
                <li class="menu-item"><a th:href="@{/appointments}" class="menu-link"><i class="fas fa-clock" style="color:#fb8c00"></i><span>All Appointments</span></a></li>
            </ul>
        </div>
    </aside>
    <main class="content-area">
        <div class="compact-form-container">
            <div class="compact-form-header">
                <div class="compact-header-left"><i class="fas fa-user-plus"></i><span th:text="${patient.id != null && !patient.id.isEmpty()} ? 'Edit Patient Record' : 'Add Patient Record'"></span></div>
                <a th:href="@{/patients}" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
            <form th:action="@{/patients/save}" th:object="${patient}" method="post" class="compact-form">
                <input type="hidden" th:field="*{id}"/>

                <!-- Personal Info -->
                <div class="compact-section">
                    <div class="compact-section-title">Personal Information</div>
                    <div class="compact-grid">
                        <div class="compact-field">
                            <label class="compact-label required">First Name</label>
                            <input type="text" th:field="*{firstName}" class="compact-input" placeholder="e.g., John" required/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label required">Last Name</label>
                            <input type="text" th:field="*{lastName}" class="compact-input" placeholder="e.g., Smith" required/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Date of Birth</label>
                            <input type="date" th:field="*{birthDate}" class="compact-input"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Gender</label>
                            <select th:field="*{gender}" class="compact-select">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="unknown">Unknown</option>
                            </select>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Blood Group</label>
                            <select th:field="*{bloodGroup}" class="compact-select">
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">MRN</label>
                            <input type="text" th:field="*{mrn}" class="compact-input" placeholder="Medical Record Number"/>
                        </div>
                    </div>
                </div>

                <!-- Contact -->
                <div class="compact-section">
                    <div class="compact-section-title">Contact Information</div>
                    <div class="compact-grid">
                        <div class="compact-field">
                            <label class="compact-label required">Phone</label>
                            <input type="tel" th:field="*{phone}" class="compact-input" placeholder="+1 555-000-0000" required/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Email</label>
                            <input type="email" th:field="*{email}" class="compact-input" placeholder="email@example.com"/>
                        </div>
                        <div class="compact-field" style="grid-column: 1 / -1">
                            <label class="compact-label">Street Address</label>
                            <input type="text" th:field="*{addressLine}" class="compact-input" placeholder="Street address"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">City</label>
                            <input type="text" th:field="*{city}" class="compact-input"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">State</label>
                            <input type="text" th:field="*{state}" class="compact-input"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Postal Code</label>
                            <input type="text" th:field="*{postalCode}" class="compact-input"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Country</label>
                            <input type="text" th:field="*{country}" class="compact-input"/>
                        </div>
                    </div>
                </div>

                <!-- Insurance -->
                <div class="compact-section">
                    <div class="compact-section-title">Insurance Information</div>
                    <div class="compact-grid">
                        <div class="compact-field">
                            <label class="compact-label">Insurance Provider</label>
                            <input type="text" th:field="*{insuranceProvider}" class="compact-input" placeholder="e.g., Blue Cross"/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label">Policy Number</label>
                            <input type="text" th:field="*{insurancePolicyNumber}" class="compact-input" placeholder="e.g., POL-001"/>
                        </div>
                    </div>
                </div>

                <!-- Emergency Contact -->
                <div class="compact-section">
                    <div class="compact-section-title">Emergency Contact</div>
                    <div class="compact-grid">
                        <div class="compact-field">
                            <label class="compact-label required">Contact Name</label>
                            <input type="text" th:field="*{emergencyName}" class="compact-input" placeholder="e.g., Jane Smith" required/>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label required">Relationship</label>
                            <select th:field="*{emergencyRelationship}" class="compact-select" required>
                                <option value="">Select Relationship</option>
                                <option value="spouse">Spouse</option>
                                <option value="parent">Parent</option>
                                <option value="child">Child</option>
                                <option value="sibling">Sibling</option>
                                <option value="friend">Friend</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="compact-field">
                            <label class="compact-label required">Contact Phone</label>
                            <input type="tel" th:field="*{emergencyPhone}" class="compact-input" placeholder="+1 555-0103" required/>
                        </div>
                    </div>
                </div>

                <div class="compact-form-actions">
                    <button type="submit" class="btn-submit"><i class="fas fa-check"></i> Submit Record</button>
                    <a th:href="@{/patients}" class="btn-cancel"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
